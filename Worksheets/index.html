<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MP3 Metadata Editor</title>
    <!-- Tailwind CSS for mobile-responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse for fast CSV parsing and export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-12">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 sticky top-0 shadow-md z-10 flex justify-between items-center px-6">
        <h1 class="text-xl font-bold">MP3 Metadata Editor</h1>
        <button id="clearStorageBtn" class="text-xs bg-red-500 hover:bg-red-600 text-white py-1 px-3 rounded hidden">Reset Session</button>
    </header>

    <main class="max-w-xl mx-auto p-4 space-y-4">
        <!-- File Upload Section -->
        <section id="uploadSection" class="bg-white p-4 rounded-xl shadow">
            <label class="block font-semibold text-gray-700 mb-2">1. Load CSV File</label>
            <input type="file" id="csvFileInput" accept=".csv" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"/>
            <p id="restoreNotice" class="text-xs text-green-600 font-medium mt-2 hidden">✓ Restored previous session from browser storage.</p>
        </section>

        <!-- Search Bar & Actions -->
        <section id="appControls" class="bg-white p-4 rounded-xl shadow space-y-3 hidden">
            <div>
                <label class="block font-semibold text-gray-700 mb-1">2. Search Metadata</label>
                <input type="text" id="searchInput" placeholder="Search Title, Artist, Album, Genre..." class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-base">
            </div>
            
            <div class="flex justify-between items-center pt-2">
                <span id="recordCount" class="text-sm text-gray-500 font-medium">0 tracks</span>
                <button id="exportBtn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 px-5 rounded-lg shadow active:scale-95 transition">
                    Export Updated CSV
                </button>
            </div>
        </section>

        <!-- Search Results List -->
        <section id="resultsContainer" class="space-y-4">
            <!-- Dynamic song cards will render here -->
        </section>
    </main>

    <!-- Container for autocomplete suggestions datalists -->
    <div id="datalistsContainer"></div>

    <script>
        let csvData = [];
        let headers = [];

        // Check if data was previously saved in browser localStorage
        window.addEventListener('DOMContentLoaded', () => {
            const savedStorage = localStorage.getItem('mp3_csv_data');
            const savedHeaders = localStorage.getItem('mp3_csv_headers');

            if (savedStorage && savedHeaders) {
                try {
                    csvData = JSON.parse(savedStorage);
                    headers = JSON.parse(savedHeaders);
                    document.getElementById('uploadSection').classList.add('bg-green-50');
                    document.getElementById('restoreNotice').classList.remove('hidden');
                    document.getElementById('clearStorageBtn').classList.remove('hidden');
                    document.getElementById('appControls').classList.remove('hidden');
                    updateDatalists();
                    renderCards(csvData);
                } catch (e) {
                    console.error("Error loading from localStorage", e);
                }
            }
        });

        // Load CSV via file input
        document.getElementById('csvFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    csvData = results.data;
                    headers = results.meta.fields;
                    
                    // Save to localStorage immediately upon loading
                    saveToLocalStorage();

                    document.getElementById('appControls').classList.remove('hidden');
                    document.getElementById('clearStorageBtn').classList.remove('hidden');
                    document.getElementById('restoreNotice').classList.add('hidden');
                    updateDatalists();
                    renderCards(csvData);
                }
            });
        });

        function saveToLocalStorage() {
            localStorage.setItem('mp3_csv_data', JSON.stringify(csvData));
            localStorage.setItem('mp3_csv_headers', JSON.stringify(headers));
        }

        // Reset/Clear session storage button
        document.getElementById('clearStorageBtn').addEventListener('click', function() {
            if (confirm("Are you sure you want to reset your saved session? All unsaved edits will be cleared.")) {
                localStorage.removeItem('mp3_csv_data');
                localStorage.removeItem('mp3_csv_headers');
                location.reload();
            }
        });

        // Generate unique dropdown suggestion lists
        function updateDatalists() {
            const fieldsToAutocomplete = ['Artist', 'Album', 'Genre', 'Date'];
            let container = document.getElementById('datalistsContainer');
            container.innerHTML = '';

            fieldsToAutocomplete.forEach(key => {
                const uniqueVals = [...new Set(csvData.map(row => row[key]).filter(val => val && val.trim() !== ''))];
                
                if (uniqueVals.length > 0) {
                    const datalist = document.createElement('datalist');
                    datalist.id = `${key.toLowerCase()}-list`;
                    uniqueVals.forEach(val => {
                        const option = document.createElement('option');
                        option.value = val;
                        datalist.appendChild(option);
                    });
                    container.appendChild(datalist);
                }
            });
        }

        // Instant Filter Search
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase().trim();
            if (!query) {
                renderCards(csvData);
                return;
            }

            const filtered = csvData.filter(row => {
                return Object.values(row).some(val => 
                    String(val).toLowerCase().includes(query)
                );
            });

            renderCards(filtered);
        });

        // Render Cards
        function renderCards(data) {
            const container = document.getElementById('resultsContainer');
            const recordCount = document.getElementById('recordCount');
            container.innerHTML = '';
            recordCount.innerText = `${data.length} tracks found`;

            if (data.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 py-8">No matching songs found.</p>';
                return;
            }

            data.slice(0, 50).forEach((row) => {
                const originalIndex = csvData.indexOf(row);
                const card = document.createElement('div');
                card.className = 'bg-white p-4 rounded-xl shadow space-y-3 border-l-4 border-blue-500';
                card.setAttribute('data-card-index', originalIndex);

                const fileName = row['FilePath'] ? row['FilePath'].split('/').pop() : `Track #${originalIndex + 1}`;
                let fieldsHTML = `<div class="font-bold text-gray-800 text-sm truncate pb-1 border-b">${fileName}</div>`;

                const editableKeys = ['Title', 'Artist', 'Album', 'TrackNumber', 'Genre', 'Date', 'Comment'];

                editableKeys.forEach(key => {
                    if (key in row) {
                        const hasList = ['Artist', 'Album', 'Genre', 'Date'].includes(key);
                        const listAttr = hasList ? `list="${key.toLowerCase()}-list"` : '';

                        fieldsHTML += `
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 uppercase">${key}</label>
                                <input type="text" 
                                    data-index="${originalIndex}" 
                                    data-key="${key}" 
                                    value="${row[key] || ''}" 
                                    ${listAttr}
                                    class="metadata-input w-full p-2 text-sm border border-gray-300 rounded-md focus:ring-1 focus:ring-blue-500 focus:outline-none mt-0.5">
                            </div>
                        `;
                    }
                });

                fieldsHTML += `
                    <div class="flex justify-end pt-2">
                        <button onclick="saveRecord(${originalIndex})" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2 px-4 rounded-lg shadow active:scale-95 transition">
                            Save Record
                        </button>
                    </div>
                `;

                card.innerHTML = fieldsHTML;
                container.appendChild(card);
            });
        }

        // Save a specific record and persist to browser localStorage
        function saveRecord(index) {
            const card = document.querySelector(`[data-card-index="${index}"]`);
            if (!card) return;
            
            const inputs = card.querySelectorAll('.metadata-input');
            
            inputs.forEach(input => {
                const key = input.getAttribute('data-key');
                csvData[index][key] = input.value;
            });

            // Save changes directly to browser local storage so it persists across refreshes
            saveToLocalStorage();
            updateDatalists();

            // Visual feedback
            const btn = card.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = 'Saved! ✓';
            btn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
            btn.classList.add('bg-green-600');

            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.remove('bg-green-600');
                btn.classList.add('bg-blue-600', 'hover:bg-blue-700');
            }, 1500);
        }

        // Export Updated CSV file to iPhone Files app
        document.getElementById('exportBtn').addEventListener('click', function() {
            if (csvData.length === 0) return;

            const updatedCSV = Papa.unparse(csvData);
            const blob = new Blob([updatedCSV], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', 'updated_mp3_metadata.csv');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
