<!doctype html>
<html lang="en">
<head>

<style>
:root{
  --bg:#f4f7f6;--card:#fff;--ink:#2c3e50;--muted:#6c7a89;
  --brand:#2980b9;--brand2:#ebf5fb;--good:#27ae60;--goodbg:#e8f8f5;
  --bad:#c0392b;--badbg:#fadbd8;--warn:#d35400;--warnbg:#fef9e7;
  --line:#dcdde1;--fs:20px;--lh:1.6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible","Trebuchet MS",Verdana,sans-serif;font-size:18px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;background:#fff;border-bottom:2px solid var(--line);position:sticky;top:0;z-index:10}
header h1{font-size:20px;margin:0 8px 0 0}
nav{display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;flex:1}
nav button{border:0;background:transparent;font:inherit;font-weight:700;padding:10px 16px;border-radius:12px;cursor:pointer;color:var(--muted);white-space:nowrap;min-height:44px}
nav button.on{background:var(--brand2);color:var(--brand)}
#xp{font-weight:700;background:var(--warnbg);color:var(--warn);padding:6px 14px;border-radius:99px}
main{max-width:980px;margin:0 auto;padding:18px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 4px 6px rgba(0,0,0,0.02)}
h2{margin:0 0 10px;font-size:22px;color:#2c3e50}
h3{margin:14px 0 8px;font-size:19px;color:var(--brand)}
button.b{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 18px;cursor:pointer;background:var(--brand);color:#fff;min-height:44px}
button.b.alt{background:var(--brand2);color:var(--brand)}
button.b.red{background:var(--badbg);color:var(--bad)}
button.b.green{background:var(--good);color:#fff}
button.b:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:18px;padding:14px 16px;margin:8px 0;border:2px solid var(--line);border-radius:14px;background:#fff;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt.right{background:var(--goodbg);border-color:var(--good)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
input[type=text],textarea,select{font:inherit;padding:12px;border:2px solid var(--line);border-radius:12px;width:100%;margin-top:6px;background:#fff}
.hide{display:none!important}
.ws-sec{border-left:5px solid var(--brand);padding-left:16px;margin-bottom:24px}
.badge{display:inline-block;padding:4px 10px;border-radius:6px;font-weight:bold;font-size:14px;background:var(--brand2);color:var(--brand)}
.ans-sheet{background:#f8f9fa;border:2px dashed var(--brand);padding:18px;border-radius:14px;margin-top:20px}
table.vocab-table{width:100%;border-collapse:collapse;margin-top:10px}
table.vocab-table th, table.vocab-table td{border:1px solid var(--line);padding:10px;text-align:left;font-size:16px}
table.vocab-table th{background:var(--brand2);color:var(--brand)}
.punnett-box{display:grid;grid-template-columns:repeat(3,60px);gap:4px;margin:10px 0}
.p-cell{background:var(--brand2);border:1px solid var(--brand);height:60px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:20px}
.p-cell.header{background:#e2e8f0;color:var(--ink)}
</style>
</head>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);

function toast(m){const t=$('#toast');t.textContent=m;t.style.opacity='1';setTimeout(()=>t.style.opacity='0',2200);}

function say(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.rate=0.85; u.lang='en-US';
  speechSynthesis.speak(u);
}

let xpScore = 0;

function show(t){
  ['ws','words','play'].forEach(x=>$('#tab-'+x).classList.toggle('hide',x!==t));
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  if(t==='ws') renderWorksheet();
  if(t==='words') renderVocabulary();
  if(t==='play') renderQuiz();
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.tab);});
