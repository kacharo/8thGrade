<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mouse Genetics Exercise</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#22303c;--muted:#5d6b78;--brand:#2f6fed;--brand2:#e8f0ff;--good:#1f9d63;--goodbg:#dff5ea;--bad:#d64545;--badbg:#fde6e6;--warn:#b86e00;--warnbg:#fff1d6;--line:#e1ddd0}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible","Trebuchet MS",Verdana,system-ui,sans-serif;font-size:18px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 18px;background:#fff;border-bottom:2px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:22px;margin:0;flex:1}
#xp{font-weight:700;background:var(--warnbg);color:var(--warn);padding:6px 12px;border-radius:99px}
main{max-width:860px;margin:0 auto;padding:18px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
h2{margin:0 0 10px;font-size:22px}
a.b,button.b{display:inline-block;text-decoration:none;font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 18px;cursor:pointer;background:var(--brand);color:#fff;min-height:44px}
.b.alt{background:var(--brand2);color:var(--brand)}
.b.green{background:var(--good)}
.b:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.steps span{flex:1 1 auto;text-align:center;padding:6px 8px;border-radius:99px;background:#ece8dc;color:var(--muted);font-size:14px;font-weight:700;white-space:nowrap}
.steps span.on{background:var(--brand);color:#fff}
.steps span.done{background:var(--goodbg);color:var(--good)}
.bar{height:12px;background:#ece8dc;border-radius:99px;overflow:hidden;margin:8px 0 14px}
.bar>i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.big{font-size:24px;line-height:1.5}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:20px;padding:14px 16px;margin:8px 0;border:2px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt.right{background:var(--goodbg);border-color:var(--good)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.opt.sel{border-color:var(--brand);background:var(--brand2)}
.opt:disabled{cursor:default;color:var(--ink)}
#fb{font-size:20px;font-weight:700;padding:12px 14px;border-radius:14px;margin:10px 0;display:none}
#fb.good{display:block;background:var(--goodbg);color:var(--good)}
#fb.warn{display:block;background:var(--warnbg);color:var(--warn)}
.wc{border:2px solid var(--line);border-radius:16px;padding:12px 14px;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.wc h3{margin:0 0 4px;font-size:22px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.say{border:0;background:var(--brand2);color:var(--brand);border-radius:99px;width:40px;height:40px;font-size:18px;cursor:pointer;flex:none}
.ex{font-style:italic;color:var(--muted);margin-top:4px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mt .opt{margin:6px 0;font-size:18px}
.mt .opt.done{background:var(--goodbg);border-color:var(--good);opacity:.75}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .3s}
.pz{display:flex;gap:22px;flex-wrap:wrap;align-items:center}
.ps{border-collapse:collapse}
.ps td,.ps th{border:2px solid var(--brand);width:84px;height:62px;text-align:center;font-size:26px;font-weight:800}
.ps th{background:#dce6f5}
.ps th.side{background:#fbe3c6}
.ps td button{width:100%;height:100%;border:0;background:#fff;font:inherit;font-weight:800;color:var(--ink);cursor:pointer}
.ps td button.q{color:#b8b8b8}
.ps td button.ok{background:var(--goodbg);color:var(--good)}
.ps td button.no{background:var(--badbg);color:var(--bad)}
.pct{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.pct .opt{width:auto;margin:0;padding:10px 16px}
.badge{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;background:var(--brand2);color:var(--brand);margin:0 6px 6px 0}
@media (max-width:640px){
  body{font-size:16px}
  header{padding:8px 10px}header h1{font-size:18px}
  main{padding:10px}.card{padding:12px;border-radius:14px}
  .opt{font-size:17px;padding:12px}.big{font-size:20px}
  .mt{grid-template-columns:1fr}
  .ps td,.ps th{width:70px;height:56px;font-size:22px}
  .steps span{font-size:12px;padding:5px 6px}
}
</style>
</head>
<body>
<header>
  <a class="b alt" href="index.html" id="back">&larr; Word Explorer</a>
  <h1>🐭 Mouse Genetics</h1>
  <div id="xp">⭐ 0</div>
</header>
<main>
  <div class="steps" id="steps"></div>
  <div id="stage"></div>
</main>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;};

/* ---- same storage keys as Word Explorer (index.html), so the XP is shared ---- */
function lsGet(k,d){try{var v=localStorage.getItem('we_'+k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem('we_'+k,JSON.stringify(v));}catch(e){}}
function totalXP(){var s=lsGet('stats',{xp:0});return (s&&s.xp)||0;}
function addXP(n){var s=lsGet('stats',{xp:0})||{xp:0};s.xp=(s.xp||0)+n;lsSet('stats',s);showXP();}
function showXP(){$('#xp').textContent='⭐ '+totalXP();}
showXP();

/* ---- read aloud ---- */
function say(t){
  if(!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.rate=0.85;u.lang='en-US';
    var vs=speechSynthesis.getVoices();var v=vs.filter(function(x){return /en[-_]US/i.test(x.lang);})[0]||vs.filter(function(x){return /^en/i.test(x.lang);})[0];
    if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}
}
function stopSay(){try{if('speechSynthesis' in window)speechSynthesis.cancel();}catch(e){}}

/* ---- content ---- */
var VOCAB=[
 ['heredity','Passing of traits from parents to offspring.','Mouse pups look like their parents.'],
 ['trait','A feature of a living thing.','Fur color is a trait.'],
 ['DNA','The molecule that holds the instructions for traits.','DNA is found in every cell.'],
 ['gene','A piece of DNA that controls one trait.','One gene controls fur color.'],
 ['allele','One version of a gene.','F is the black allele. f is the white allele.'],
 ['genotype','The pair of alleles an organism has.','FF, Ff, and ff are genotypes.'],
 ['phenotype','How the trait looks.','Black fur is a phenotype.'],
 ['dominant allele','An allele that always shows when it is present.','F is dominant, so Ff is black.'],
 ['recessive allele','An allele that is hidden when a dominant one is present.','f is recessive. It shows only in ff.'],
 ['homozygous','Two alleles that are the same.','FF and ff are homozygous.'],
 ['heterozygous','Two alleles that are different.','Ff is heterozygous.'],
 ['hybrid','Offspring of parents with different traits.','A black mouse and a white mouse have hybrid pups.'],
 ['inheritance','The way traits are received from parents.','Each pup gets one allele from each parent.'],
 ['Punnett square','A grid used to predict the genotypes of offspring.','A Punnett square is a 2 by 2 box of letters.']
];
var MATCH=[
 ['gene','A piece of DNA that controls a trait'],
 ['allele','One version of a gene'],
 ['genotype','The letters of the allele pair, like Ff'],
 ['phenotype','What the trait looks like'],
 ['homozygous','Two matching alleles, like FF'],
 ['heterozygous','Two different alleles, like Ff'],
 ['dominant allele','Always shows when present'],
 ['recessive allele','Hidden when a dominant allele is present']
];
var TF=[
 {q:'A baby mouse gets one allele from each parent.',opts:['True','False'],ans:0,why:'Yes! One allele from mom and one from dad.'},
 {q:'The genotype is what the mouse looks like.',opts:['True','False'],ans:1,why:'What it looks like is the phenotype. The genotype is the letters.'},
 {q:'A mouse with the genotype Ff has black fur.',opts:['True','False'],ans:0,why:'F is dominant, so one F is enough for black fur.'},
 {q:'A white mouse must have the genotype ff.',opts:['True','False'],ans:0,why:'White is recessive, so it needs two f alleles.'},
 {q:'Two white mice (ff and ff) can have a black baby.',opts:['True','False'],ans:1,why:'Neither parent has an F, so every baby is ff and white.'},
 {q:'Genes are made of DNA.',opts:['True','False'],ans:0,why:'A gene is a piece of DNA.'}
];
var MC=[
 {q:'Which genotype is homozygous dominant?',opts:['FF','Ff','ff','fF'],ans:0,why:'Two matching dominant alleles: FF.'},
 {q:'Which allele makes white fur?',opts:['F','f','Both','Neither'],ans:1,why:'The small f is the white allele.'},
 {q:'A black mouse (FF) and a white mouse (ff) have babies. What are the babies’ genotypes?',opts:['All FF','All ff','All Ff','Half FF, half ff'],ans:2,why:'Each baby gets one F and one f, so all are Ff.'},
 {q:'What do we call how a trait looks, like black fur?',opts:['Genotype','Allele','Phenotype','Hybrid'],ans:2,why:'How it looks is the phenotype.'},
 {q:'A mouse is Ff. Which word describes it?',opts:['Homozygous','Heterozygous','Recessive','Extinct'],ans:1,why:'Two different alleles means heterozygous.'},
 {q:'What tool predicts the genotypes of babies?',opts:['A Punnett square','A microscope','A fossil','A thermometer'],ans:0,why:'A Punnett square shows every possible baby.'}
];
var FILL=[
 {q:'Passing traits from parents to offspring is called ____.',opts:['heredity','phenotype','hybrid','DNA'],ans:0,why:'Heredity.'},
 {q:'Genes are pieces of ____.',opts:['hybrid','DNA','allele','phenotype'],ans:1,why:'Genes are pieces of DNA.'},
 {q:'Each version of a gene is called an ____.',opts:['allele','genotype','trait','hybrid'],ans:0,why:'An allele is one version of a gene.'},
 {q:'The ____ allele always shows when it is present.',opts:['recessive','dominant','hybrid','DNA'],ans:1,why:'Dominant alleles always show.'},
 {q:'The ____ allele is hidden when a dominant allele is there.',opts:['dominant','heredity','recessive','genotype'],ans:2,why:'Recessive alleles hide.'},
 {q:'The allele letters, like Ff, are the ____.',opts:['phenotype','genotype','hybrid','heredity'],ans:1,why:'The letters are the genotype.'},
 {q:'The way the mouse looks, like black fur, is the ____.',opts:['genotype','allele','phenotype','DNA'],ans:2,why:'How it looks is the phenotype.'},
 {q:'A baby from a black parent and a white parent is a ____.',opts:['hybrid','phenotype','gene','DNA'],ans:0,why:'Parents with different traits make a hybrid.'}
];
var PUN=[
 {t:'Black (FF) × White (ff)',top:['F','F'],side:['f','f'],black:100},
 {t:'Black (Ff) × Black (Ff)',top:['F','f'],side:['F','f'],black:75},
 {t:'Black (Ff) × White (ff)',top:['F','f'],side:['f','f'],black:50},
 {t:'White (ff) × White (ff)',top:['f','f'],side:['f','f'],black:0}
];
var FACTS=[
 'Gregor Mendel was a monk who studied pea plants in the 1860s. He is called the father of genetics.',
 'Scientists study mice because they have babies fast and share most of their genes with humans.',
 'Two black mice can have a white baby if both carry a hidden f allele.',
 'Many traits, like height, are controlled by lots of genes, so they are not simply black or white.'
];
var NAMES=['Learn','Match','True / False','Quiz','Fill in','Punnett','Submit'];

/* ---- state ---- */
var S={step:0,pts:0,max:0};
var LOG=[];   // every answer she gives, for the saved answer file
var stage=$('#stage');
function renderSteps(){
  $('#steps').innerHTML=NAMES.map(function(n,i){return '<span class="'+(i===S.step?'on':(i<S.step?'done':''))+'">'+(i<S.step?'✓ ':'')+esc(n)+'</span>';}).join('');
}
function go(n){stopSay();S.step=n;renderSteps();window.scrollTo(0,0);[learn,match,runTF,runMC,runFill,punnett,done][n]();}
function bar(i,n){return '<div class="bar"><i style="width:'+Math.round(i/n*100)+'%"></i></div>';}

/* ---- 1. learn ---- */
function learn(){
  stage.innerHTML='<div class="card"><h2>1. Learn the words</h2><p class="muted">Tap 🔊 to hear a word and its meaning. Then press the big button.</p>'+
   '<div class="card" style="background:#eef3fb"><div class="big">A gene has two <b>alleles</b>: <b>F</b> = black fur (dominant) and <b>f</b> = white fur (recessive). A baby gets <b>one allele from each parent</b>.</div><div style="margin-top:8px"><button class="say" id="sayIntro">🔊</button></div></div>'+
   '<div class="grid">'+VOCAB.map(function(v,i){return '<div class="wc"><h3><span>'+esc(v[0])+'</span><button class="say" data-i="'+i+'" aria-label="Hear '+esc(v[0])+'">🔊</button></h3><div>'+esc(v[1])+'</div><div class="ex">'+esc(v[2])+'</div></div>';}).join('')+'</div>'+
   '<div class="row" style="margin-top:16px"><button class="b green" id="next">I’m ready &rarr;</button></div></div>';
  $('#sayIntro').onclick=function(){say('A gene has two alleles. Capital F is black fur, and it is dominant. Little f is white fur, and it is recessive. A baby gets one allele from each parent.');};
  stage.querySelectorAll('.say[data-i]').forEach(function(b){b.onclick=function(){var v=VOCAB[+b.dataset.i];say(v[0]+'. '+v[1]+' '+v[2]);};});
  $('#next').onclick=function(){go(1);};
}

/* ---- 2. match ---- */
function match(){
  var terms=MATCH.map(function(m,i){return {i:i,t:m[0]};});
  var defs=shuffle(MATCH.map(function(m,i){return {i:i,t:m[1]};}));
  var sel=null,left=MATCH.length,firstTry={},misses=0,wrong={};
  S.max+=MATCH.length*10;
  stage.innerHTML='<div class="card"><h2>2. Match the word to its meaning</h2><p class="muted">Tap a word, then tap its meaning.</p><div class="mt"><div id="L"></div><div id="R"></div></div><div id="fb"></div><div class="row"><button class="b green hide" id="next" style="display:none">Next &rarr;</button></div></div>';
  function draw(){
    $('#L').innerHTML=terms.map(function(x){return '<button class="opt'+(x.done?' done':'')+(sel===x.i?' sel':'')+'" data-t="'+x.i+'"'+(x.done?' disabled':'')+'>'+esc(x.t)+'</button>';}).join('');
    $('#R').innerHTML=defs.map(function(x){return '<button class="opt'+(x.done?' done':'')+'" data-d="'+x.i+'"'+(x.done?' disabled':'')+'>'+esc(x.t)+'</button>';}).join('');
    $('#L').querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){sel=+b.dataset.t;say(MATCH[sel][0]);draw();};});
    $('#R').querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){pick(+b.dataset.d,b);};});
  }
  function pick(d,btn){
    if(sel===null){fb('Tap a word on the left first.','warn');return;}
    if(d===sel){
      terms.filter(function(x){return x.i===d;})[0].done=true;defs.filter(function(x){return x.i===d;})[0].done=true;
      if(!firstTry[d]){firstTry[d]=1;S.pts+=firstTry['m'+d]?0:10;}
      LOG.push({sec:'2. Match',q:MATCH[d][0],tried:(wrong[d]||[]).concat([MATCH[d][1]]),answer:MATCH[d][1],first:!(wrong[d]&&wrong[d].length)});
      left--;sel=null;fb('✓ Yes!','good');draw();
      if(!left){$('#next').style.display='';$('#next').classList.remove('hide');$('#next').onclick=function(){go(2);};fb('All matched! ⭐','good');}
    }else{
      firstTry['m'+sel]=1;(wrong[sel]=wrong[sel]||[]).push(btn.textContent);btn.classList.add('wrong','shake');fb('Not that one. Try again.','warn');
      setTimeout(function(){btn.classList.remove('wrong','shake');},500);
    }
  }
  function fb(m,c){var f=$('#fb');f.textContent=m;f.className=c;}
  draw();
}

/* ---- generic one-at-a-time question runner (true/false, quiz, fill in) ---- */
function runQs(title,intro,items,nextStep,shuffleOpts){
  var i=0;S.max+=items.length*10;
  function show(){
    var it=items[i],first=true,locked=false,tried=[];
    var order=it.opts.map(function(o,k){return {o:o,k:k};});
    if(shuffleOpts)order=shuffle(order);
    stage.innerHTML='<div class="card"><h2>'+esc(title)+'</h2><p class="muted">'+esc(intro)+' ('+(i+1)+' of '+items.length+')</p>'+bar(i,items.length)+
     '<div class="big">'+esc(it.q)+' <button class="say" id="sq" aria-label="Read aloud">🔊</button></div><div id="opts">'+
     order.map(function(x){return '<button class="opt" data-k="'+x.k+'">'+esc(x.o)+'</button>';}).join('')+'</div><div id="fb"></div><div class="row"><button class="b green" id="next" style="display:none">'+(i===items.length-1?'Finish &rarr;':'Next &rarr;')+'</button></div></div>';
    $('#sq').onclick=function(){say(it.q.replace('____','blank'));};
    stage.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){
      if(locked)return;var k=+b.dataset.k;
      if(k===it.ans){
        locked=true;b.classList.add('right');if(first)S.pts+=10;
        tried.push(it.opts[k]);LOG.push({sec:title,q:it.q,tried:tried.slice(),answer:it.opts[it.ans],first:first});
        stage.querySelectorAll('.opt').forEach(function(x){x.disabled=true;});
        var f=$('#fb');f.className='good';f.textContent=(first?'✓ Correct! ':'✓ Got it! ')+it.why;
        $('#next').style.display='';$('#next').onclick=function(){i++;if(i<items.length)show();else go(nextStep);};
      }else{
        first=false;tried.push(it.opts[k]);b.classList.add('wrong','shake');b.disabled=true;
        var f2=$('#fb');f2.className='warn';f2.textContent='Not quite. Try another one.';
      }
    };});
  }
  show();
}
function runTF(){runQs('3. True or False','Tap True or False.',TF,3,false);}
function runMC(){runQs('4. Quiz','Pick the best answer.',MC,4,true);}
function runFill(){runQs('5. Fill in the blank','Pick the word that fits.',FILL,5,true);}

/* ---- 6. Punnett ---- */
function geno(a,b){return (a===b)?a+b:'Ff';}
function punnett(){
  var i=0;S.max+=PUN.length*20;
  function show(){
    var p=PUN[i],cells=['?','?','?','?'],okCells=false,firstCells=true,firstPct=true,pctDone=false,checked=false,attempts=[],pctTried=[];
    var want=[geno(p.side[0],p.top[0]),geno(p.side[0],p.top[1]),geno(p.side[1],p.top[0]),geno(p.side[1],p.top[1])];
    stage.innerHTML='<div class="card"><h2>6. Punnett squares</h2><p class="muted">Tap each box to change it. Put the top letter and the side letter together. ('+(i+1)+' of '+PUN.length+')</p>'+bar(i,PUN.length)+
     '<div class="big" style="margin-bottom:10px"><b>'+esc(p.t)+'</b></div>'+
     '<div class="pz"><table class="ps"><tr><th></th><th>'+p.top[0]+'</th><th>'+p.top[1]+'</th></tr>'+
     '<tr><th class="side">'+p.side[0]+'</th><td><button class="q" data-c="0">?</button></td><td><button class="q" data-c="1">?</button></td></tr>'+
     '<tr><th class="side">'+p.side[1]+'</th><td><button class="q" data-c="2">?</button></td><td><button class="q" data-c="3">?</button></td></tr></table>'+
     '<div><button class="b" id="chk">Check my square</button></div></div>'+
     '<div id="pq" style="display:none;margin-top:14px"><div class="big">What percent of the babies are <b>black</b>? <span class="muted">(black = at least one F)</span></div><div class="pct" id="pct"></div></div>'+
     '<div id="fb"></div><div class="row"><button class="b green" id="next" style="display:none">'+(i===PUN.length-1?'Finish &rarr;':'Next &rarr;')+'</button></div></div>';
    var CY=['?','FF','Ff','ff'];
    stage.querySelectorAll('.ps td button').forEach(function(b){b.onclick=function(){
      if(okCells)return;var c=+b.dataset.c;cells[c]=CY[(CY.indexOf(cells[c])+1)%CY.length];
      b.textContent=cells[c];b.className=cells[c]==='?'?'q':'';
    };});
    $('#chk').onclick=function(){
      if(okCells)return;var all=true;attempts.push(cells.join(' '));
      stage.querySelectorAll('.ps td button').forEach(function(b){var c=+b.dataset.c;
        if(cells[c]===want[c]){b.className='ok';}else{b.className='no';all=false;}});
      var f=$('#fb');
      if(all){okCells=true;if(firstCells)S.pts+=10;f.className='good';f.textContent='✓ Square done! Now count the black babies.';$('#chk').disabled=true;
        $('#pq').style.display='';
        $('#pct').innerHTML=[0,25,50,75,100].map(function(n){return '<button class="opt" data-n="'+n+'">'+n+'%</button>';}).join('');
        $('#pct').querySelectorAll('.opt').forEach(function(b){b.onclick=function(){
          if(pctDone)return;var n=+b.dataset.n;pctTried.push(n+'%');
          if(n===p.black){pctDone=true;b.classList.add('right');if(firstPct)S.pts+=10;
            LOG.push({sec:'6. Punnett squares',q:p.t+' - the four boxes (top-left, top-right, bottom-left, bottom-right)',tried:attempts.slice(),answer:want.join(' '),first:firstCells});
            LOG.push({sec:'6. Punnett squares',q:p.t+' - percent of black babies',tried:pctTried.slice(),answer:p.black+'%',first:firstPct});
            $('#pct').querySelectorAll('.opt').forEach(function(x){x.disabled=true;});
            var ww=100-p.black;f.className='good';f.textContent='✓ '+p.black+'% black and '+ww+'% white.';
            $('#next').style.display='';$('#next').onclick=function(){i++;if(i<PUN.length)show();else go(6);};
          }else{firstPct=false;b.classList.add('wrong','shake');b.disabled=true;f.className='warn';f.textContent='Count the boxes with at least one capital F. Try again.';}
        };});
      }else{firstCells=false;f.className='warn';f.textContent='Red boxes need fixing. Top letter + side letter.';
        setTimeout(function(){stage.querySelectorAll('.ps td button.no').forEach(function(b){b.className=cells[+b.dataset.c]==='?'?'q':'';});},900);}
    };
  }
  show();
}

/* ---- submit + save ---- */
function pad(n){return (n<10?'0':'')+n;}
function stamp(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes());}
function buildReport(name,when){
  var pct=S.max?Math.round(S.pts/S.max*100):0,ok=LOG.filter(function(e){return e.first;}).length;
  var L=['MOUSE GENETICS (ONE TRAIT) - STUDENT ANSWERS','',
    'Name: '+(name||'(not entered)'),'Date: '+when.toLocaleString(),
    'Score: '+S.pts+' of '+S.max+' points ('+pct+'%)','Right on the first try: '+ok+' of '+LOG.length+' questions','',
    '[OK] = right on the first try     [RETRY] = needed more than one try'];
  var sec='';
  LOG.forEach(function(e){
    if(e.sec!==sec){sec=e.sec;L.push('');L.push('== '+sec+' ==');}
    L.push((e.first?'[OK]    ':'[RETRY] ')+e.q);
    L.push('        Her answers: '+e.tried.join('  >  '));
    L.push('        Correct answer: '+e.answer);
  });
  return L.join('\n')+'\n';
}
function saveFile(text,fname){
  try{var bl=new Blob([text],{type:'text/plain'});var a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=fname;
    document.body.appendChild(a);a.click();setTimeout(function(){try{URL.revokeObjectURL(a.href);}catch(e){}a.remove();},800);return true;}catch(e){return false;}
}
function done(){
  var pct=S.max?Math.round(S.pts/S.max*100):0;
  var savedRec=null;
  stage.innerHTML='<div class="card"><h2>7. Submit your answers</h2><div class="big">You finished everything! You earned <b>'+S.pts+'</b> of '+S.max+' points ('+pct+'%).</div>'+
   '<p class="muted">Type your name, then press Submit. Your answers are saved on this device and a file is downloaded.</p>'+
   '<input type="text" id="nm" placeholder="Your name" autocomplete="given-name" style="max-width:360px">'+
   '<div class="row" style="margin-top:14px"><button class="b green" id="sub">✅ Submit my answers</button></div><div id="after"></div></div>';
  $('#sub').onclick=function(){
    var btn=$('#sub');btn.disabled=true;
    var when=new Date(),name=($('#nm').value||'').trim();
    var report=buildReport(name,when);
    var fname='mouse-genetics-answers_'+(name?name.replace(/[^A-Za-z0-9]+/g,'-')+'_':'')+stamp(when)+'.txt';
    // 1) store on this device (browser storage, shared with Word Explorer)
    var subs=lsGet('ex_mouse_subs',[])||[];
    savedRec={id:when.getTime(),when:when.toISOString(),name:name,pts:S.pts,max:S.max,pct:pct,file:fname,report:report,log:LOG.slice()};
    subs.unshift(savedRec);subs=subs.slice(0,20);lsSet('ex_mouse_subs',subs);
    // 2) stars: only points above her previous best count
    var prev=lsGet('ex_mouse',{best:0})||{best:0},best=prev.best||0,gain=Math.max(0,S.pts-best);
    if(gain>0){addXP(gain);lsSet('ex_mouse',{best:S.pts,when:when.toISOString()});}
    // 3) download the answer file
    var okDl=saveFile(report,fname);
    $('#after').innerHTML='<div id="fb" class="good" style="display:block;margin-top:14px">✓ Submitted and saved!</div>'+
     '<p>'+(gain>0?'⭐ <b>+'+gain+'</b> added to your Word Explorer stars. ':'You already earned this many stars before. Try again to beat your best of '+best+'. ')+'</p>'+
     '<p class="muted">Saved on this device inside Word Explorer (Science tab).'+(okDl?' A file named <b>'+esc(fname)+'</b> was also downloaded. Look in your Downloads folder.':' The download did not start, so use the button below.')+'</p>'+
     '<h2 style="margin-top:14px">Fun facts</h2><ul style="padding-left:20px">'+FACTS.map(function(f){return '<li style="margin:6px 0">'+esc(f)+'</li>';}).join('')+'</ul>'+
     '<div class="row" style="margin-top:14px"><a class="b" href="index.html">&larr; Back to Word Explorer</a><button class="b alt" id="dl">⬇ Download answers again</button><button class="b alt" id="again">Play again</button></div>';
    $('#dl').onclick=function(){saveFile(report,fname);};
    $('#again').onclick=function(){S={step:0,pts:0,max:0};LOG=[];go(0);};
  };
}

go(0);
})();
</script>
