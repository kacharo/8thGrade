<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Math - 8th Grade Learning Hub</title>
<link rel="stylesheet" href="../shared.css">
</head>
<body>
<div id="toast"></div>
<header>
  <a class="b alt" href="../index.html">🏠 Home</a>
  <h1>➗ Math</h1>
  <div id="xp">⭐ 0</div>
</header>
<main>
  <div class="card"><h2>Exercises</h2><div class="grid" id="list"></div></div>
  <div class="card" id="practice" style="display:none"></div>
  <div class="card" id="saved"></div>
</main>
<script src="../shared.js" data-home="../index.html"></script>
<script>
(function(){
// To add an exercise: put its .html file in this folder and add one line to this list.
var EXERCISES=[];
var SUBJECT='Math';
var $=function(s){return document.querySelector(s);};
$('#xp').textContent='⭐ '+W.xp.get();
$('#list').innerHTML=EXERCISES.length?EXERCISES.map(function(x){
  var best=(W.store.get('ex_'+x.id,{best:0})||{}).best||0;
  return '<div class="wc"><h3>'+x.icon+' '+W.esc(x.title)+'</h3><div class="muted">'+W.esc(x.unit)+'</div><div class="def">'+W.esc(x.desc)+'</div>'+
    (best?'<div class="dots">Best: '+best+' points</div>':'')+'<div class="row" style="margin-top:8px"><a class="b" href="'+W.esc(x.href)+'">Open</a></div></div>';}).join('')
  :'<p class="muted">No exercises here yet. New ones will show up on this page.</p>';
W.ui.saved($('#saved'),SUBJECT);
function drawPractice(){
  var pr=W.practice.list(),ks=Object.keys(pr),el=$('#practice');
  if(!ks.length){el.style.display='none';return;}
  el.style.display='';
  el.innerHTML='<h2>🔁 Words to practice</h2><p class="muted">Tap 🔊 to hear the word. When you can say it, tap ✓.</p>'+ks.map(function(k){
    return '<span class="chip">'+W.esc(pr[k].word)+' <button data-h="'+W.esc(k)+'" aria-label="Hear it">🔊</button><button data-c="'+W.esc(k)+'" aria-label="I can say it">✓</button></span>';}).join('');
  el.querySelectorAll('[data-h]').forEach(function(b){b.onclick=function(){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(pr[b.dataset.h].word);u.rate=0.7;u.lang='en-US';speechSynthesis.speak(u);}catch(e){}};});
  el.querySelectorAll('[data-c]').forEach(function(b){b.onclick=function(){W.practice.clear(b.dataset.c);drawPractice();};});
}
drawPractice();
})();
</script>
</body>
</html>
