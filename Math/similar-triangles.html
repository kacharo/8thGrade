<style>

header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 18px;background:#fff;border-bottom:2px solid var(--line);position:sticky;top:0;z-index:5}

.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var escRe=function(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');};
var shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;};

/* ---- storage and stars come from ../shared.js (same keys as the rest of the hub) ---- */
function lsGet(k,d){return W.store.get(k,d);}
function lsSet(k,v){W.store.set(k,v);}
function totalXP(){return W.xp.get();}
function addXP(n){W.xp.add(n);showXP();}
function showXP(){$('#xp').textContent='⭐ '+totalXP();}
showXP();

/* ---- read aloud ---- */
function say(t,rate){
  if(!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.rate=rate||0.85;u.lang='en-US';
    var vs=speechSynthesis.getVoices();var v=vs.filter(function(x){return /en[-_]US/i.test(x.lang);})[0]||vs.filter(function(x){return /^en/i.test(x.lang);})[0];
    if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}
}
function stopSay(){try{if('speechSynthesis' in window)speechSynthesis.cancel();}catch(e){}}

/* ---- triangle drawings ---- */
var R=Math.PI/180;
// a = angle at the left corner, b = angle at the right corner (degrees). lab = [left, right, top] angle labels, nm = corner letters.
function triPts(a,b){
  var c=180-a-b,s=Math.sin(b*R)/Math.sin(c*R);
  return [[0,0],[1,0],[s*Math.cos(a*R),s*Math.sin(a*R)]];
}
function fit(pts,w,h,pad){
  var xs=pts.map(function(p){return p[0];}),ys=pts.map(function(p){return p[1];});
  var x0=Math.min.apply(0,xs),x1=Math.max.apply(0,xs),y0=Math.min.apply(0,ys),y1=Math.max.apply(0,ys);
  var k=Math.min((w-2*pad)/((x1-x0)||1),(h-2*pad)/((y1-y0)||1));
  var ox=(w-(x1-x0)*k)/2,oy=(h-(y1-y0)*k)/2;
  return pts.map(function(p){return [ox+(p[0]-x0)*k,h-(oy+(p[1]-y0)*k)];});
}
function lbl(P,i,txt,inside,col){
  var v=P[i],a=P[(i+1)%3],b=P[(i+2)%3];
  var ux=a[0]-v[0],uy=a[1]-v[1],ul=Math.sqrt(ux*ux+uy*uy)||1,wx=b[0]-v[0],wy=b[1]-v[1],wl=Math.sqrt(wx*wx+wy*wy)||1;
  ux/=ul;uy/=ul;wx/=wl;wy/=wl;
  var bx=ux+wx,by=uy+wy,bl=Math.sqrt(bx*bx+by*by)||1;bx/=bl;by/=bl;          // bisector, points inside
  var half=Math.acos(Math.max(-1,Math.min(1,ux*wx+uy*wy)))/2;
  var r=inside?Math.min(Math.min(ul,wl)*0.55,22/Math.sin(half)+4):-17;
  var x=v[0]+bx*r,y=v[1]+by*r;
  return '<text x="'+x.toFixed(1)+'" y="'+(y+6).toFixed(1)+'" text-anchor="middle" font-size="'+(inside?16:18)+'" font-weight="700" fill="'+(col||'#22303c')+'">'+esc(txt)+'</text>';
}
function triSVG(a,b,lab,nm,opt){
  opt=opt||{};var w=opt.w||230,h=opt.h||160;
  var P=fit(triPts(a,b),w,h,26);
  var s='<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" role="img" aria-label="triangle"><polygon points="'+P.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ')+'" fill="'+(opt.fill||'#eef3fb')+'" stroke="#2f6fed" stroke-width="3" stroke-linejoin="round"/>';
  for(var i=0;i<3;i++){if(lab&&lab[i])s+=lbl(P,i,lab[i],true,lab[i]==='?'?'#d64545':'#b86e00');if(nm&&nm[i])s+=lbl(P,i,nm[i],false);}
  return s+'</svg>';
}
function fig(parts){return '<div class="figs">'+parts.map(function(p){return '<div class="fg">'+p[1]+'<div class="cap">'+p[0]+'</div></div>';}).join('')+'</div>';}
function quadSVG(w,h,name){
  var W2=230,H2=150,x=(W2-w)/2,y=(H2-h)/2,m=14;
  var c=[[x,y],[x+w,y],[x+w,y+h],[x,y+h]],sq='';
  c.forEach(function(p,i){var sx=i===0||i===3?1:-1,sy=i<2?1:-1;sq+='<path d="M'+(p[0]+sx*m)+' '+p[1]+' V'+(p[1]+sy*m)+' H'+p[0]+'" fill="none" stroke="#b86e00" stroke-width="2"/>';});
  return '<svg viewBox="0 0 '+W2+' '+H2+'" width="'+W2+'" height="'+H2+'" role="img" aria-label="'+name+'"><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="#eef3fb" stroke="#2f6fed" stroke-width="3"/>'+sq+'</svg>';
}
// big triangle JKL with a smaller triangle MNL inside it (they share corner L)
function nestedSVG(){
  var w=300,h=190,P=fit(triPts(70,30),w,h,24);   // P[0]=K (70°), P[1]=L (30°), P[2]=J (80°)
  var K=P[0],L=P[1],J=P[2],t=0.52;
  var N=[L[0]+(K[0]-L[0])*t,L[1]+(K[1]-L[1])*t],M=[L[0]+(J[0]-L[0])*t,L[1]+(J[1]-L[1])*t];
  var pt=function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);};
  var T=function(p,txt,dx,dy,col,fs){return '<text x="'+(p[0]+dx).toFixed(1)+'" y="'+(p[1]+dy).toFixed(1)+'" text-anchor="middle" font-size="'+(fs||18)+'" font-weight="700" fill="'+(col||'#22303c')+'">'+txt+'</text>';};
  return '<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" role="img" aria-label="triangle JKL with triangle MNL inside">'+
   '<polygon points="'+[K,L,J].map(pt).join(' ')+'" fill="#eef3fb" stroke="#2f6fed" stroke-width="3" stroke-linejoin="round"/>'+
   '<line x1="'+N[0].toFixed(1)+'" y1="'+N[1].toFixed(1)+'" x2="'+M[0].toFixed(1)+'" y2="'+M[1].toFixed(1)+'" stroke="#1f9d63" stroke-width="3"/>'+
   T(K,'K',-12,14)+T(L,'L',14,6)+T(J,'J',-4,-10)+T(N,'N',-4,18)+T(M,'M',-2,-10)+
   T(K,'70°',30,-6,'#b86e00',16)+T(L,'30°',-38,0,'#b86e00',16)+T(M,'80°',14,24,'#b86e00',16)+'</svg>';
}

/* ---- content ---- */
var VOCAB=(window.WORDS||[]).map(function(x){return [x.w,x.def,x.ex,x.say];});   // list lives in words.js

var MATCH=[
 ['similar','Same shape, maybe a different size'],
 ['congruent','Exactly the same size'],
 ['corresponding','In the matching spot on the other shape'],
 ['vertex','A corner where two sides meet'],
 ['obtuse','An angle bigger than 90°'],
 ['quadrilateral','A shape with 4 sides'],
 ['sufficient','Enough'],
 ['justify','Give a reason that proves it']
];
var TF=[
 {q:'The three angles of every triangle add up to 180°.',opts:['True','False'],ans:0,why:'Always 180°, for every triangle.'},
 {q:'Similar triangles must be the same size.',opts:['True','False'],ans:1,why:'Similar means same shape. The size can be different.'},
 {q:'If two pairs of corresponding angles are congruent, the triangles are similar.',opts:['True','False'],ans:0,why:'That is the Angle-Angle rule. Two pairs is enough.'},
 {q:'A triangle can have two obtuse angles.',opts:['True','False'],ans:1,why:'Two angles over 90° would add to more than 180°.'},
 {q:'Two quadrilaterals with all the same angles must be similar.',opts:['True','False'],ans:1,why:'A square and a long rectangle both have four 90° angles, but they are not the same shape.'},
 {q:'Two triangles each have a 100° angle. That is all we know. We cannot tell if they are similar.',opts:['True','False'],ans:0,why:'One pair of angles is not enough information.'}
];
var MC=[
 {q:'A triangle has angles of 50° and 60°. What is the third angle?',opts:['70°','80°','110°','60°'],ans:0,why:'180 − 50 − 60 = 70.'},
 {q:'A triangle has angles of 90° and 35°. What is the third angle?',opts:['45°','55°','65°','125°'],ans:1,why:'180 − 90 − 35 = 55.'},
 {q:'What is the least you need to know to show two triangles are similar?',opts:['Two pairs of congruent corresponding angles','One pair of congruent angles','One pair of congruent sides','That they are both triangles'],ans:0,why:'Two pairs of angles. Then the third pair matches too.'},
 {q:'Triangle 1 has angles 30° and 70°. Triangle 2 has angles 70° and 80°. Are they similar?',opts:['Yes','No','Not enough information'],ans:0,why:'Triangle 1’s third angle is 180 − 30 − 70 = 80°. Both are 30°, 70°, 80°.'},
 {q:'Which shape is a quadrilateral?',opts:['Rectangle','Triangle','Circle','Pentagon'],ans:0,why:'A rectangle has 4 sides.'},
 {q:'A square and a long, skinny rectangle both have four 90° angles. Are they similar?',opts:['Yes, the angles match','No, the shapes are different','Not enough information'],ans:1,why:'For quadrilaterals, matching angles are not sufficient. The sides must grow by the same amount too.'}
];
var FILL=[
 {q:'The three angles of a triangle add up to ____.',opts:['180°','90°','360°','100°'],ans:0,why:'180°.'},
 {q:'Shapes with the same shape, but maybe a different size, are ____.',opts:['similar','obtuse','congruent','sufficient'],ans:0,why:'Similar.'},
 {q:'Angles in matching spots on two shapes are ____ angles.',opts:['obtuse','corresponding','sufficient','quadrilateral'],ans:1,why:'Corresponding angles are in matching spots.'},
 {q:'Two angles with the same measure are ____.',opts:['similar','obtuse','congruent','justify'],ans:2,why:'Congruent angles have the same measure.'},
 {q:'An angle bigger than 90° is ____.',opts:['congruent','obtuse','similar','vertex'],ans:1,why:'Obtuse means bigger than 90°.'},
 {q:'The corner point of a triangle is a ____.',opts:['vertex','quadrilateral','justify','sufficient'],ans:0,why:'A corner is a vertex.'},
 {q:'Two pairs of congruent angles is ____ to show triangles are similar.',opts:['obtuse','sufficient','corresponding','vertex'],ans:1,why:'Sufficient means enough.'},
 {q:'When you give a reason that proves your answer, you ____ it.',opts:['justify','vertex','similar','obtuse'],ans:0,why:'Justify.'}
];
// 7. Sort: like the check-mark table in the homework
var SORT_OPTS=['Similar','Not similar','Not enough information'];
function sortFig(a,b){return '<div class="figs"><div class="angbox"><small>Triangle 1</small>'+a+'</div><div class="angbox t2"><small>Triangle 2</small>'+b+'</div></div>';}
var SORT=[
 {q:'Triangle 1 has 20° and 50°.  Triangle 2 has 20° and 110°.',fig:sortFig('20°, 50°','20°, 110°'),opts:SORT_OPTS,ans:0,why:'Triangle 1’s third angle is 180 − 20 − 50 = 110°. Both are 20°, 50°, 110°.'},
 {q:'Triangle 1 has 70° and 40°.  Triangle 2 has 40° and 70°.',fig:sortFig('70°, 40°','40°, 70°'),opts:SORT_OPTS,ans:0,why:'Same two angles, just listed in a different order.'},
 {q:'Triangle 1 has 90°.  Triangle 2 has 90°.',fig:sortFig('90°','90°'),opts:SORT_OPTS,ans:2,why:'We only know one angle in each. One pair is not sufficient.'},
 {q:'Triangle 1 has 30° and 45°.  Triangle 2 has 30° and 60°.',fig:sortFig('30°, 45°','30°, 60°'),opts:SORT_OPTS,ans:1,why:'Triangle 1 is 30°, 45°, 105°. Triangle 2 is 30°, 60°, 90°. The angles do not match.'},
 {q:'Triangle 1 has 50° and 60°.  Triangle 2 has 25° and 30°.',fig:sortFig('50°, 60°','25°, 30°'),opts:SORT_OPTS,ans:1,why:'Triangle 1 is 50°, 60°, 70°. Triangle 2 is 25°, 30°, 125°. Half the angles does not make a similar triangle.'}
];
// 8. Detective: one figure, a few small questions each
var F1=fig([['Triangle ABC',triSVG(50,70,['50°','70°',''],['A','B','C'])],['Triangle DEF',triSVG(70,50,['70°','50°',''],['D','E','F'],{fill:'#fff1d6'})],['Triangle GHI',triSVG(51,70,['51°','70°',''],['G','H','I'],{fill:'#fde6e6'})]]);
var F2=fig([['Triangle ABC',triSVG(65,45,['65°','45°','?'],['A','B','C'])],['Triangle DEF',triSVG(70,45,['70°','45°','?'],['D','E','F'],{fill:'#fff1d6'})]]);
var F3=fig([['Is ΔJKL ~ ΔMNL?',nestedSVG()]]);
var F4=fig([['Triangle 1',triSVG(100,45,['100°','',''],null)],['Triangle 2',triSVG(80,55,['80°','',''],null,{fill:'#fff1d6'})]]);
var F5=fig([['Square',quadSVG(110,110,'square')],['Rectangle',quadSVG(200,70,'rectangle')]]);
var DET=[
 {fig:F1,q:'Problem 1. What is the missing angle in Triangle ABC?',opts:['60°','50°','70°','120°'],ans:0,why:'180 − 50 − 70 = 60°.'},
 {fig:F1,q:'Problem 1. Which triangle is similar to Triangle ABC?',opts:['Triangle DEF','Triangle GHI','Both','Neither'],ans:0,why:'DEF has 70° and 50°, the same as ABC. GHI has 51°, not 50°. Close is not congruent!'},
 {fig:F2,q:'Problem 2. Ava says these triangles are NOT similar. First, find the missing angle in Triangle ABC.',opts:['60°','70°','80°','45°'],ans:1,why:'180 − 65 − 45 = 70°.'},
 {fig:F2,q:'Problem 2. Is Ava correct?',opts:['No. Both triangles have 45° and 70°, so they are similar.','Yes. The angles 65° and 70° are different.','Yes. You need side lengths.'],ans:0,why:'Find the third angle first. ABC is 45°, 65°, 70°. DEF is 45°, 70°, 65°.'},
 {fig:F3,q:'Problem 3. What is angle J in the big triangle JKL?',opts:['70°','80°','90°','100°'],ans:1,why:'180 − 70 − 30 = 80°.'},
 {fig:F3,q:'Problem 3. Is ΔJKL ~ ΔMNL? Pick the best reason.',opts:['Yes. They share angle L (30°), and angle J = angle M (80°).','No. Triangle MNL is smaller.','Not enough information.'],ans:0,why:'Two pairs of congruent angles is sufficient. Size does not matter.'},
 {fig:F4,q:'Problem 4. Triangle 2 has an 80° angle. Can it also have a 100° angle?',opts:['No. 80° + 100° = 180°, so there is no room for a third angle.','Yes. Any angle can go in a triangle.'],ans:0,why:'The three angles must add to 180°, and the third angle cannot be 0°.'},
 {fig:F4,q:'Problem 4. Priya says there is not enough information. Han says the triangles are not similar. Who is right?',opts:['Han','Priya'],ans:0,why:'Triangle 1 has 100°, and Triangle 2 can never have 100°. So they cannot be similar.'},
 {fig:F5,q:'Problem 5. Noah says two matching angle pairs are sufficient for quadrilaterals too. Why is he wrong?',opts:['A square and a rectangle have all the same angles, but they are not the same shape.','Quadrilaterals have no angles.','Quadrilaterals always have 3 angles.'],ans:0,why:'For quadrilaterals, the sides matter too. Angles alone are not sufficient.'}
];

function learn(){

/* ---- 2. say and spell ---- */
function lev(a,b){var m=a.length,n=b.length,p=[],j,i;for(j=0;j<=n;j++)p[j]=j;for(i=1;i<=m;i++){var c=[i];for(j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
var SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
function heardOK(heard,word){
  var h=String(heard).toLowerCase().replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim(),w=word.toLowerCase().replace(/[^a-z ]/g,'');
  var hc=h.replace(/ /g,''),wc=w.replace(/ /g,'');
  if(!hc)return false;
  return hc.indexOf(wc)>=0||lev(hc,wc)<=Math.max(1,Math.floor(wc.length/4));
}
function saySpell(){
  var pnow=W.practice.list(),isP=function(i){return !!pnow[VOCAB[i][0].toLowerCase()];};
  var idx=VOCAB.map(function(v,i){return i;});
  // words she needs to practice come first
  var order=shuffle(idx.filter(isP)).concat(shuffle(idx.filter(function(i){return !isP(i);}))),n=0;
  var okFirst=0,okSecond=0,missed=[];
  S.max+=VOCAB.length*10+(SRC?VOCAB.length*10:0);
  var recog=null,micBroken=false;
  function stopRec(){try{if(recog)recog.abort();}catch(e){}recog=null;}
  function summary(){
    stopRec();
    stage.innerHTML='<div class="card"><h2>2. Say and spell: results</h2>'+
     (SRC&&(okFirst+okSecond+missed.length>0)?'<div class="big">Pronunciation: <b>'+okFirst+'</b> on the first try, <b>'+okSecond+'</b> on the second try, <b>'+missed.length+'</b> to practice.</div>':'<div class="big">Spelling is done!</div>')+
     (micBroken?'<div class="banner">The microphone was not available on this device, so some words were not tested for pronunciation.<br><small>iPhone: allow the microphone for this site in Safari, and turn on Dictation in Settings, General, Keyboard.</small></div>':'')+
     (missed.length?'<div class="banner">🔁 <b>Words to practice:</b><br>'+missed.map(esc).join(', ')+'<br>They were added to <b>My Words</b> in the ELA reading app, and they come first next time.</div>':(SRC&&!micBroken?'<div class="good" style="margin-top:10px">No practice words. Great talking!</div>':''))+
     '<div class="row" style="margin-top:14px"><button class="b green" id="next">Next: Match &rarr;</button>'+(missed.length?'<a class="b alt" href="../ELA/index.html">Open the reading app</a>':'')+'</div></div>';
    $('#next').onclick=function(){go(2);};
  }
  function show(){
    stopRec();
    var v=VOCAB[order[n]],word=v[0],target=word.toUpperCase();
    var head='<div class="card"><h2>2. Say and spell</h2><p class="muted">Word '+(n+1)+' of '+VOCAB.length+'</p>'+bar(n,VOCAB.length);
    var tries=[],logged=false,listening=false,passed=false,failed=false,inSpell=false;
    function logSay(extra){
      if(logged)return;logged=true;
      var e={sec:'2. Say & Spell',q:'Say the word: '+word,tried:tries.length?tries.slice():['(not tested)'],answer:word+' ('+v[3]+')',first:false};
      for(var k in extra)e[k]=extra[k];LOG.push(e);
    }
    /* ---------- part A: say it (two tries) ---------- */
    var useMic=SRC&&!micBroken;
    stage.innerHTML=head+'<div class="muted">Step A: say it'+(pnow[word.toLowerCase()]?' &middot; <span class="badge wait">🔁 practice word</span>':'')+'</div>'+
     '<div class="big" style="margin:6px 0"><b>'+esc(word)+'</b></div>'+
     '<div class="rs" style="font-size:22px">say it: '+esc(v[3])+'</div>'+
     '<div class="row" style="margin:8px 0"><button class="b alt" id="hear">🔊 Hear it</button><button class="b alt" id="hears">💬 In a sentence</button>'+
     (useMic?'<button class="b" id="mic">🎤 Tap, then say it</button>':'<button class="b green" id="said">Next: spell it &rarr;</button>')+'</div>'+
     (useMic?'<div id="tryinfo" class="muted">Try 1 of 2</div>':'<div class="muted">'+(micBroken?'The microphone is not available on this device, so pronunciation is not tested.':'This browser cannot listen, so your pronunciation is not tested here.')+'</div>')+
     '<div class="sent">'+hl(v[2],word)+'</div><div id="fb"></div><div class="row" id="goRow"></div></div>';
    $('#hear').onclick=function(){say(word,0.7);};
    $('#hears').onclick=function(){say(v[2]);};
    if(!useMic){
      $('#said').onclick=function(){logSay({first:false,notTested:true,tried:[micBroken?'(not tested: microphone not available)':'(not tested: this browser cannot listen)']});spell();};
    }else{
      $('#mic').onclick=function(){
        if(listening||passed||failed)return;
        var f=$('#fb'),btn=$('#mic'),resolved=false,wd=null;
        try{speechSynthesis.cancel();}catch(e){}              // iPhone: stop talking before listening
        f.className='warn';f.textContent='Listening… say "'+word+'".';btn.disabled=true;listening=true;
        function arm(ms){clearTimeout(wd);wd=setTimeout(function(){resolve('empty',[]);},ms);}
        // Every press ends here exactly once, whatever the phone does (result, error, silence, or nothing at all).
        function resolve(kind,alts,code){
          if(resolved)return;resolved=true;clearTimeout(wd);listening=false;stopRec();
          if(kind==='broken'){
            micBroken=true;S.max-=10*(VOCAB.length-n);
            logSay({first:false,notTested:true,tried:tries.concat(['microphone not available ('+(code||'unknown')+')'])});
            f.className='warn';f.innerHTML='I cannot use the microphone on this device, so pronunciation will not be tested.<br><small>iPhone: allow the microphone for this site in Safari, and turn on Dictation in Settings, General, Keyboard.</small>';
            btn.style.display='none';$('#tryinfo').textContent='';
            $('#goRow').innerHTML='<button class="b green" id="goSpell">Next: spell it &rarr;</button>';$('#goSpell').onclick=spell;
            return;
          }
          tries.push('try '+(tries.length+1)+': '+(alts&&alts.length?'heard "'+alts[0]+'"':'nothing heard'));
          var heard=alts&&alts.length?alts[0]:'';
          if(alts&&alts.some(function(a){return heardOK(a,word);})){
            passed=true;var first=tries.length===1;S.pts+=first?10:5;if(first)okFirst++;else okSecond++;
            W.practice.clear(word);logSay({first:first,pass:true});
            f.className='good';f.textContent='✓ I heard "'+heard+'". '+(first?'Great!':'Nice job!');
            btn.style.display='none';
            setTimeout(spell,1100);
          }else if(tries.length>=2){
            failed=true;missed.push(word);
            W.practice.add(word,{def:v[1],ex:v[2],phonetic:v[3],from:'Similar Triangles'});
            logSay({first:false,practice:true});
            f.className='warn';f.innerHTML=(heard?'I heard "'+esc(heard)+'". ':'I did not hear you. ')+'That was your second try, so let’s move on. <b>"'+esc(word)+'" was added to your practice words.</b>';
            btn.style.display='none';$('#tryinfo').textContent='';
            $('#goRow').innerHTML='<button class="b green" id="goSpell">Next: spell it &rarr;</button>';$('#goSpell').onclick=spell;
          }else{
            f.className='warn';f.textContent=heard?'I heard "'+heard+'". Listen once more, then try again.':'I did not hear you. Tap the mic and say the word.';
            $('#tryinfo').textContent='Try 2 of 2';btn.disabled=false;
          }
        }
        try{
          recog=new SRC();recog.lang='en-US';recog.continuous=false;recog.interimResults=false;recog.maxAlternatives=5;
          recog.onstart=function(){arm(10000);};               // starts counting once the phone is really listening
          recog.onresult=function(e){
            var alts=[];try{for(var k=0;k<e.results[0].length;k++)alts.push(e.results[0][k].transcript);}catch(x){}
            resolve('heard',alts);
          };
          recog.onerror=function(e){
            var er=e&&e.error;
            if(er==='not-allowed'||er==='service-not-allowed'||er==='audio-capture')resolve('broken',[],er);
            else resolve('empty',[],er);                        // no-speech, aborted, network, anything else: counts as a try
          };
          recog.onend=function(){resolve('empty',[]);};         // ended without a result: counts as a try
          arm(25000);                                           // backstop if the phone never starts
          recog.start();
        }catch(err){resolve('broken',[],'cannot start');}
      };
    }
    /* ---------- part B: spell it ---------- */
    function spell(){
      if(inSpell)return;inSpell=true;stopRec();
      var letters=target.replace(/ /g,'').split('');
      var pool=shuffle(letters.map(function(c,k){return {c:c,k:k,used:false};}));
      var slots=[],stries=[],peeked=false,marks=null,solved=false;
      var blank=v[2].replace(new RegExp(escRe(word),'ig'),'_____');
      stage.innerHTML=head+'<div class="muted">Step B: spell it</div><div class="big" style="margin:6px 0">Meaning: '+esc(v[1])+'</div>'+
       '<div class="sent">'+esc(blank)+'</div>'+
       '<div class="row"><button class="b alt" id="hear2">🔊 Hear the word</button><button class="b alt" id="hear3">💬 Hear the sentence</button></div>'+
       '<div class="slots" id="slots"></div><div class="tiles" id="tiles"></div>'+
       '<div class="row"><button class="b green" id="chk" disabled>Check my spelling</button><button class="b alt" id="undo">⌫ Undo</button><button class="b alt" id="clr">Clear</button><button class="b alt" id="peek">👀 Show me the word</button></div>'+
       '<div id="fb"></div><div class="row"><button class="b green" id="next" style="display:none">'+(n===VOCAB.length-1?'Finish &rarr;':'Next word &rarr;')+'</button></div></div>';
      $('#hear2').onclick=function(){say(word,0.7);};$('#hear3').onclick=function(){say(v[2]);};
      function draw(){
        var si=0,out='';
        for(var c=0;c<target.length;c++){
          if(target[c]===' '){out+='<span class="gap"></span>';continue;}
          var t=slots[si],cls=marks?(marks[si]?'ok':'no'):'';
          out+='<div class="slot '+cls+'">'+(t?esc(t.c):'')+'</div>';si++;
        }
        $('#slots').innerHTML=out;
        $('#tiles').innerHTML=pool.map(function(t,i){return '<button class="tile" data-i="'+i+'"'+(t.used||solved?' disabled':'')+'>'+esc(t.c)+'</button>';}).join('');
        $('#tiles').querySelectorAll('.tile').forEach(function(b){b.onclick=function(){
          if(slots.length>=letters.length)return;var t=pool[+b.dataset.i];t.used=true;slots.push(t);marks=null;draw();};});
        $('#chk').disabled=solved||slots.length!==letters.length;
      }
      $('#undo').onclick=function(){if(solved||!slots.length)return;slots.pop().used=false;marks=null;draw();};
      $('#clr').onclick=function(){if(solved)return;slots.forEach(function(t){t.used=false;});slots=[];marks=null;draw();};
      $('#peek').onclick=function(){peeked=true;var f=$('#fb');f.className='warn';f.textContent='The word is: '+word+'. Now spell it.';};
      $('#chk').onclick=function(){
        var attempt=slots.map(function(t){return t.c;}).join('');stries.push(attempt);
        if(attempt===letters.join('')){
          solved=true;marks=letters.map(function(){return true;});
          var firstTry=stries.length===1&&!peeked;if(firstTry)S.pts+=10;
          LOG.push({sec:'2. Say & Spell',q:'Spell the word that means: '+v[1],tried:stries.concat(peeked?['(peeked at the word)']:[]),answer:word,first:firstTry});
          draw();var f=$('#fb');f.className='good';f.textContent=(firstTry?'✓ Perfect spelling! ':'✓ You spelled it! ')+word;
          $('#next').style.display='';$('#next').onclick=function(){n++;if(n<VOCAB.length)show();else summary();};
          $('#undo').disabled=$('#clr').disabled=$('#peek').disabled=true;
        }else{
          marks=slots.map(function(t,i){return t.c===letters[i];});draw();
          var f2=$('#fb');f2.className='warn';f2.textContent='Not quite. Red letters are in the wrong place. Tap Undo to fix them.';
        }
      };
      draw();
    }
  }
  show();
}

/* ---- 2. match ---- */
function match(){
  var terms=MATCH.map(function(m,i){return {i:i,t:m[0]};});
  var defs=shuffle(MATCH.map(function(m,i){return {i:i,t:m[1]};}));
  var sel=null,left=MATCH.length,firstTry={},misses=0,wrong={};
  S.max+=MATCH.length*10;
  stage.innerHTML='<div class="card"><h2>3. Match the word to its meaning</h2><p class="muted">Tap a word, then tap its meaning.</p><div class="mt"><div id="L"></div><div id="R"></div></div><div id="fb"></div><div class="row"><button class="b green hide" id="next" style="display:none">Next &rarr;</button></div></div>';
  function draw(){
    $('#L').innerHTML=terms.map(function(x){return '<button class="opt'+(x.done?' done':'')+(sel===x.i?' sel':'')+'" data-t="'+x.i+'"'+(x.done?' disabled':'')+'>'+esc(x.t)+'</button>';}).join('');
    $('#R').innerHTML=defs.map(function(x){return '<button class="opt'+(x.done?' done':'')+'" data-d="'+x.i+'"'+(x.done?' disabled':'')+'>'+esc(x.t)+'</button>';}).join('');
    $('#L').querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){sel=+b.dataset.t;say(MATCH[sel][0]);draw();};});
    $('#R').querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){pick(+b.dataset.d,b);};});
  }
  function pick(d,btn){
    if(sel===null){fb('Tap a word on the left first.','warn');return;}
    if(d===sel){
      terms.filter(function(x){return x.i===d;})[0].done=true;defs.filter(function(x){return x.i===d;})[0].done=true;
      if(!firstTry[d]){firstTry[d]=1;S.pts+=firstTry['m'+d]?0:10;}
      LOG.push({sec:'3. Match',q:MATCH[d][0],tried:(wrong[d]||[]).concat([MATCH[d][1]]),answer:MATCH[d][1],first:!(wrong[d]&&wrong[d].length)});
      left--;sel=null;fb('✓ Yes!','good');draw();
      if(!left){$('#next').style.display='';$('#next').classList.remove('hide');$('#next').onclick=function(){go(3);};fb('All matched! ⭐','good');}
    }else{
      firstTry['m'+sel]=1;(wrong[sel]=wrong[sel]||[]).push(btn.textContent);btn.classList.add('wrong','shake');fb('Not that one. Try again.','warn');
      setTimeout(function(){btn.classList.remove('wrong','shake');},500);
    }
  }
  function fb(m,c){var f=$('#fb');f.textContent=m;f.className=c;}
  draw();
}

/* ---- generic one-at-a-time question runner (true/false, quiz, fill in, sort, detective) ---- */
function spoken(t){return t.replace(/____/g,'blank').replace(/°/g,' degrees').replace(/Δ/g,'triangle ').replace(/~/g,' is similar to ').replace(/ − /g,' minus ');}
function runQs(title,intro,items,nextStep,shuffleOpts){
  var i=0;S.max+=items.length*10;
  function show(){
    var it=items[i],first=true,locked=false,tried=[];
    var order=it.opts.map(function(o,k){return {o:o,k:k};});
    if(shuffleOpts)order=shuffle(order);
    stage.innerHTML='<div class="card"><h2>'+esc(title)+'</h2><p class="muted">'+esc(intro)+' ('+(i+1)+' of '+items.length+')</p>'+bar(i,items.length)+
     (it.fig||'')+
     '<div class="big">'+esc(it.q)+' <button class="say" id="sq" aria-label="Read aloud">🔊</button></div><div id="opts">'+
     order.map(function(x){return '<button class="opt" data-k="'+x.k+'">'+esc(x.o)+'</button>';}).join('')+'</div><div id="fb"></div><div class="row"><button class="b green" id="next" style="display:none">'+(i===items.length-1?'Finish &rarr;':'Next &rarr;')+'</button></div></div>';
    $('#sq').onclick=function(){say(spoken(it.q));};
    stage.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){
      if(locked)return;var k=+b.dataset.k;
      if(k===it.ans){
        locked=true;b.classList.add('right');if(first)S.pts+=10;
        tried.push(it.opts[k]);LOG.push({sec:title,q:it.q,tried:tried.slice(),answer:it.opts[it.ans],first:first});
        stage.querySelectorAll('.opt').forEach(function(x){x.disabled=true;});
        var f=$('#fb');f.className='good';f.textContent=(first?'✓ Correct! ':'✓ Got it! ')+it.why;
        $('#next').style.display='';$('#next').onclick=function(){i++;if(i<items.length)show();else go(nextStep);};
      }else{
        first=false;tried.push(it.opts[k]);b.classList.add('wrong','shake');b.disabled=true;
        var f2=$('#fb');f2.className='warn';f2.textContent='Not quite. Try another one.';
      }
    };});
  }
  show();
}

/* ---- submit + save ---- */
function pad(n){return (n<10?'0':'')+n;}
function stamp(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes());}
function buildReport(name,when){
  var pct=S.max?Math.round(S.pts/S.max*100):0,ok=LOG.filter(function(e){return e.first;}).length;
  var L=['SIMILAR TRIANGLES (UNIT 2 LESSON 7) - STUDENT ANSWERS','',
    'Name: '+(name||'(not entered)'),'Date: '+when.toLocaleString(),
    'Score: '+S.pts+' of '+S.max+' points ('+pct+'%)','Right on the first try: '+ok+' of '+LOG.length+' questions','',
    '[OK] = right on the first try     [RETRY] = needed more than one try     [PRACTICE] = could not say it in two tries     [NOT TESTED] = no microphone'];
  var pw=LOG.filter(function(e){return e.practice;}).map(function(e){return e.q.replace('Say the word: ','');});
  if(pw.length)L.splice(6,0,'Words to practice: '+pw.join(', '));
  var sec='';
  LOG.forEach(function(e){
    if(e.sec!==sec){sec=e.sec;L.push('');L.push('== '+sec+' ==');}
    L.push((e.practice?'[PRACTICE] ':(e.notTested?'[NOT TESTED] ':(e.first?'[OK]    ':'[RETRY] ')))+e.q);
    L.push('        Her answers: '+e.tried.join('  >  '));
    L.push('        Correct answer: '+e.answer);
  });
  return L.join('\n')+'\n';
}
function saveFile(text,fname){
  try{var bl=new Blob([text],{type:'text/plain'});var a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=fname;
    document.body.appendChild(a);a.click();setTimeout(function(){try{URL.revokeObjectURL(a.href);}catch(e){}a.remove();},800);return true;}catch(e){return false;}
}
function done(){
  var pct=S.max?Math.round(S.pts/S.max*100):0,cfg=W.gh.cfg(),sending=false;
  stage.innerHTML='<div class="card"><h2>9. Submit your answers</h2><div class="big">You finished everything! You earned <b>'+S.pts+'</b> of '+S.max+' points ('+pct+'%).</div>'+
   '<p class="muted">Type your first name, then press Submit. '+(cfg?'Your answers will be saved to GitHub.':'GitHub saving is not set up yet, so a file will be downloaded instead. A parent can set it up on the Home page, under Parent settings.')+'</p>'+
   '<input type="text" id="nm" placeholder="Your first name" autocomplete="given-name" style="max-width:360px">'+
   '<div class="row" style="margin-top:14px"><button class="b green" id="sub">✅ Submit my answers</button></div><div id="after"></div></div>';
  $('#sub').onclick=function(){
    $('#sub').disabled=true;
    var when=new Date(),name=($('#nm').value||'').trim();
    var report=buildReport(name,when);
    var fname='similar-triangles-answers_'+(name?name.replace(/[^A-Za-z0-9]+/g,'-')+'_':'')+stamp(when)+'.txt';
    var rec={id:when.getTime(),when:when.toISOString(),name:name,pts:S.pts,max:S.max,pct:pct,file:fname,report:report,log:LOG.slice(),ghStatus:cfg?'pending':'none',subject:'Math',exercise:'similar-triangles',title:'Similar Triangles (Unit 2 Lesson 7)',dir:W.dir('Math')};
    W.subs.add(rec);
    var prev=lsGet('ex_simtri',{best:0})||{best:0},best=prev.best||0,gain=Math.max(0,S.pts-best);
    if(gain>0){addXP(gain);lsSet('ex_simtri',{best:S.pts,when:when.toISOString()});}
    var starLine=(gain>0?'⭐ <b>+'+gain+'</b> added to your stars. ':'You already earned this many stars before. Try again to beat your best of '+best+'. ');
    function buttons(retry){
      return '<div class="row" style="margin-top:14px"><a class="b" href="index.html">&larr; Back to Math</a>'+(retry?'<button class="b" id="retry">↻ Try sending again</button>':'')+
        '<button class="b alt" id="dl">⬇ Download answers</button><button class="b alt" id="again">Play again</button></div>';
    }
    function facts(){return '<h2 style="margin-top:14px">Fun facts</h2><ul style="padding-left:20px">'+FACTS.map(function(f){return '<li style="margin:6px 0">'+esc(f)+'</li>';}).join('')+'</ul>';}
    function wire(){
      $('#dl').onclick=function(){saveFile(report,fname);};
      $('#again').onclick=function(){S={step:0,pts:0,max:0};LOG=[];go(0);};
      if($('#retry'))$('#retry').onclick=send;
    }
    function send(){
      if(sending)return;sending=true;
      $('#after').innerHTML='<div id="fb" class="warn" style="display:block;margin-top:14px">Sending your answers to GitHub…</div>';
      W.gh.saveRecord(rec).then(function(r){
        sending=false;
        if(r.ok){
          W.subs.patch(rec.id,{ghStatus:'sent',ghErr:''});
          $('#after').innerHTML='<div id="fb" class="good" style="display:block;margin-top:14px">✓ Submitted! Your answers are saved to GitHub.</div><p>'+starLine+'</p>'+facts()+buttons(false);
        }else{
          W.subs.patch(rec.id,{ghStatus:'pending',ghErr:W.gh.msg(r)});
          $('#after').innerHTML='<div id="fb" class="warn" style="display:block;margin-top:14px">Your answers are saved on this device, but they did not reach GitHub yet.</div>'+
            '<p>'+esc(W.gh.msg(r))+'</p><p class="muted">They will be sent automatically the next time this subject page or the Home page is opened with internet, or press the button.</p><p>'+starLine+'</p>'+buttons(true);
        }
        wire();
      });
    }
    if(cfg){send();}
    else{
      var okDl=saveFile(report,fname);
      $('#after').innerHTML='<div id="fb" class="good" style="display:block;margin-top:14px">✓ Submitted!</div><p>'+starLine+'</p>'+
        '<p class="muted">GitHub saving is not set up, so your answers were saved on this device'+(okDl?' and a file named <b>'+esc(fname)+'</b> was downloaded.':'. Use the download button.')+'</p>'+facts()+buttons(false);
      wire();
    }
  };
}

if(!VOCAB.length){
  stage.innerHTML='<div class="card"><h2>One file is missing</h2><div class="banner"><b>The word list file (<code>words.js</code>) was not found.</b> Upload <code>words.js</code> to the <b>Math</b> folder of the repository, then refresh this page.</div><a class="b alt" href="index.html">&larr; Back to Math</a></div>';
}else go(0);
})();
</script>
